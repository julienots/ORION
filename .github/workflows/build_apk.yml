name: Build ORION APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract project zip
        run: |
          unzip -o orion-assistant.zip -d extracted
          mv extracted/orion orion_src

      - name: Generate fresh Flutter project scaffold
        run: flutter create --platforms=android --org com.orion --project-name orion_assistant project

      - name: Overlay custom code onto scaffold
        run: |
          rm -rf project/lib
          cp -r orion_src/lib project/lib
          cp orion_src/pubspec.yaml project/pubspec.yaml
          cp orion_src/android/app/src/main/AndroidManifest.xml project/android/app/src/main/AndroidManifest.xml
          mkdir -p project/android/app/src/main/assets

      # porcupine_flutter (et parfois d'autres plugins) est compilé contre un
      # SDK Android trop ancien en interne, ce qui casse la compatibilité avec
      # ses propres dépendances (androidx.fragment/window exigent SDK 34+).
      # On patche ça juste après le téléchargement (voir étape suivante).
      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      # On patche directement le fichier Gradle du plugin téléchargé,
      # plutôt que d'essayer de le surcharger depuis l'extérieur (ça a
      # échoué à deux reprises à cause du timing d'évaluation Gradle).
      - name: Patch porcupine_flutter compileSdkVersion
        run: |
          FILE=$(find "$HOME/.pub-cache" -path "*/porcupine_flutter-*/android/build.gradle" | head -n 1)
          echo "Fichier trouvé : $FILE"
          if [ -n "$FILE" ]; then
            sed -i -E 's/(compileSdk(Version)?[[:space:]]*=?[[:space:]]*)[0-9]+/\g<1>35/' "$FILE"
            grep -n "compileSdk" "$FILE"
          else
            echo "Fichier porcupine_flutter/android/build.gradle introuvable, on continue quand même."
          fi

      - name: Build APK (release)
        working-directory: project
        run: |
          flutter build apk --release \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=PICOVOICE_ACCESS_KEY=${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-release-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
