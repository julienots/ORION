name: Build ORION APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pas de version figée : on prend toujours la dernière stable,
          # pour rester compatible avec les plugins (speech_to_text, flutter_tts...)
          # qui exigent des versions récentes d'Android Gradle Plugin / SDK.

      # 1) Le repo ne contient que orion-assistant.zip : on le décompresse
      #    pour récupérer notre code (lib/, pubspec.yaml, AndroidManifest custom).
      - name: Extract project zip
        run: |
          unzip -o orion-assistant.zip -d extracted
          mv extracted/orion orion_src

      # 2) On laisse Flutter générer un vrai projet Android à jour (v2 embedding,
      #    build.gradle, MainActivity, wrapper Gradle...) au lieu d'essayer de
      #    le maintenir à la main. C'est ce qui manquait et causait l'erreur.
      - name: Generate fresh Flutter project scaffold
        run: flutter create --platforms=android --org com.orion --project-name orion_assistant project

      # 3) On greffe notre code par-dessus le squelette généré.
      - name: Overlay custom code onto scaffold
        run: |
          rm -rf project/lib
          cp -r orion_src/lib project/lib
          cp orion_src/pubspec.yaml project/pubspec.yaml
          cp orion_src/android/app/src/main/AndroidManifest.xml project/android/app/src/main/AndroidManifest.xml
          mkdir -p project/android/app/src/main/assets

      # porcupine_flutter (et parfois d'autres plugins) est compilé contre un
      # SDK Android trop ancien en interne, ce qui casse la compatibilité avec
      # ses propres dépendances (androidx.fragment/window exigent SDK 34+).
      # On force tous les modules Android (librairies) à compiler contre le
      # SDK 35, ce qui résout ce conflit sans toucher au code des plugins.
      - name: Force compileSdk 35 on all Android library modules
        run: |
          cat >> project/android/build.gradle.kts << 'EOF'
          subprojects {
              afterEvaluate {
                  if (project.plugins.hasPlugin("com.android.library")) {
                      extensions.findByType(com.android.build.gradle.LibraryExtension::class.java)?.apply {
                          compileSdk = 35
                      }
                  }
              }
          }
          EOF

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK (release)
        working-directory: project
        # Les clés API sont lues depuis les "Secrets" du repo GitHub
        # (Settings > Secrets and variables > Actions), jamais commit en dur.
        run: |
          flutter build apk --release \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=PICOVOICE_ACCESS_KEY=${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-release-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
