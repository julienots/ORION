name: Build ORION APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract project zip
        run: |
          unzip -o orion-assistant.zip -d extracted
          mv extracted/orion orion_src

      - name: Generate fresh Flutter project scaffold
        run: flutter create --platforms=android --org com.orion --project-name orion_assistant project

      - name: Overlay custom code onto scaffold
        run: |
          rm -rf project/lib
          cp -r orion_src/lib project/lib
          cp orion_src/pubspec.yaml project/pubspec.yaml
          cp orion_src/android/app/src/main/AndroidManifest.xml project/android/app/src/main/AndroidManifest.xml
          mkdir -p project/android/app/src/main/assets

      - name: Force compileSdk 35 on all Android library modules
        run: |
          cat >> project/android/build.gradle.kts << 'EOF'
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure(com.android.build.gradle.LibraryExtension::class.java) {
                      compileSdk = 35
                  }
              }
          }
          EOF

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK (release)
        working-directory: project
        run: |
          flutter build apk --release \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=PICOVOICE_ACCESS_KEY=${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-release-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
