name: Build ORION APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Le repo ne contient que orion-assistant.zip (pas les fichiers extraits).
      # On le décompresse ici, dans le job GitHub, pour retrouver un vrai
      # projet Flutter (pubspec.yaml, lib/, android/...) avant de builder.
      - name: Extract project zip
        run: |
          unzip -o orion-assistant.zip -d extracted
          # Le zip contient un dossier "orion/" à l'intérieur : on le remonte
          # pour que le projet Flutter soit directement dans ./project
          mv extracted/orion project

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK (release)
        working-directory: project
        # Les clés API sont lues depuis les "Secrets" du repo GitHub
        # (Settings > Secrets and variables > Actions), jamais commit en dur.
        run: |
          flutter build apk --release \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=PICOVOICE_ACCESS_KEY=${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-release-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
