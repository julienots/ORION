name: Build ORION APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract project zip
        run: |
          unzip -o orion-assistant.zip -d extracted
          mv extracted/orion orion_src

      - name: Generate fresh Flutter project scaffold
        run: flutter create --platforms=android --org com.orion --project-name orion_assistant project

      - name: Overlay custom code onto scaffold
        run: |
          rm -rf project/lib
          cp -r orion_src/lib project/lib
          cp orion_src/pubspec.yaml project/pubspec.yaml
          cp orion_src/android/app/src/main/AndroidManifest.xml project/android/app/src/main/AndroidManifest.xml
          mkdir -p project/android/app/src/main/assets

      # porcupine_flutter (et parfois d'autres plugins) est compilé contre un
      # SDK Android trop ancien en interne, ce qui casse la compatibilité avec
      # ses propres dépendances (androidx.fragment/window exigent SDK 34+).
      # On patche ça juste après le téléchargement (voir étape suivante).
      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      # Plusieurs plugins (porcupine_flutter, flutter_voice_processor, et
      # potentiellement d'autres) codent en dur un compileSdkVersion trop
      # ancien (31) dans leur propre build.gradle, incompatible avec leurs
      # dépendances (androidx.fragment/window exigent SDK 34+). Au lieu de
      # corriger plugin par plugin, on patche TOUS les build.gradle du
      # pub-cache d'un coup.
      - name: Patch outdated compileSdkVersion in all cached plugins
        run: |
          find "$HOME/.pub-cache" -path "*/android/build.gradle" -print0 | \
          while IFS= read -r -d '' FILE; do
            if grep -qE 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+' "$FILE"; then
              sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdkVersion 35/' "$FILE"
              echo "Patché : $FILE"
            fi
          done

      - name: Build APK (release)
        working-directory: project
        run: |
          flutter build apk --release \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=PICOVOICE_ACCESS_KEY=${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-release-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
